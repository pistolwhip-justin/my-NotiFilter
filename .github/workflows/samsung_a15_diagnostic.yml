name: Samsung A15 diagnostic APK

concurrency:
  group: notifilter-diagnostic-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - diagnostic/samsung-a15-listener-persistence
  workflow_dispatch:

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build diagnostic APK
        run: ./gradlew app:assembleNightly

      - name: Create temporary diagnostic signing key
        run: |
          keytool -genkeypair -keystore diagnostic.keystore -storepass diagnosticpass -keypass diagnosticpass -alias diagnostic -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NotiFilter Diagnostic"

      - name: Sign diagnostic APK
        run: |
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${BUILD_TOOLS}/apksigner" sign --ks diagnostic.keystore --ks-key-alias diagnostic --ks-pass pass:diagnosticpass --key-pass pass:diagnosticpass app/build/outputs/apk/nightly/app-nightly-unsigned.apk
          "${BUILD_TOOLS}/apksigner" verify --verbose app/build/outputs/apk/nightly/app-nightly-unsigned.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/nightly/app-nightly-unsigned.apk NotiFilter_DiagnosticWTF.apk

      - name: Assemble phone setup package
        run: |
          mkdir -p diagnostic-package
          cp NotiFilter_DiagnosticWTF.apk diagnostic-package/
          cp diagnostics/github_token.txt diagnostic-package/
          cp diagnostics/README-token-setup.txt diagnostic-package/
          cd diagnostic-package
          zip -j ../NotiFilter_Diagnostic_Package.zip *

      - name: Upload installable diagnostic APK
        uses: actions/upload-artifact@v7
        with:
          name: NotiFilter-DiagnosticWTF
          path: NotiFilter_DiagnosticWTF.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK and token setup package
        uses: actions/upload-artifact@v7
        with:
          name: NotiFilter-Diagnostic-Setup-Package
          path: NotiFilter_Diagnostic_Package.zip
          if-no-files-found: error
          retention-days: 14
